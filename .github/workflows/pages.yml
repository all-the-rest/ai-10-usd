name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - source-updated
  schedule:
    - cron: "0 23 * * *"   # 1 AM local (CEST, 23:00 UTC) — backstop so a missed source-updated dispatch still refreshes the comparison; drifts to midnight CET in winter (DST)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Production-Läufe teilen sich die "pages"-Gruppe (kein Cancel). PR-Läufe
  # (Dependabot) bekommen eine eigene Gruppe, damit sie echte Deploys nicht
  # blockieren bzw. in die Queue einreihen.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test generator
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit generated data
        id: commit
        # Pusht nach main -> nur bei push/dispatch/schedule, nie auf pull_request
        if: github.event_name != 'pull_request'
        run: |
          if node scripts/has-semantic-change.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/latest.json
            git commit -m "chore: update comparison data $(date -u +%Y-%m-%d)"
            # Parallele Dispatch-Läufe committen dieselbe Datei — ohne Rebase
            # scheitert der zweite Push als non-fast-forward (Race).
            MAX_TRIES=3
            for i in $(seq 1 "$MAX_TRIES"); do
              if git pull --rebase origin main && git push; then
                echo "pushed on attempt $i/$MAX_TRIES"
                break
              fi
              if [ "$i" -eq "$MAX_TRIES" ]; then
                echo "::error::push failed after $MAX_TRIES attempts"
                exit 1
              fi
              echo "Attempt $i/$MAX_TRIES: push rejected, rebasing and retrying…"
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no semantic data changes, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-10-usd-dist
          path: dist

  deploy:
    needs: build
    # Deploy (github-pages environment) darf auf pull_request NIE laufen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5